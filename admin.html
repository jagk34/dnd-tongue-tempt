<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin — D&D by Tongue Tempt</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #1A1A2E; --card: #22223B; --card2: #2A2A45;
      --gold: #F4A832; --gold-dark: #D4891A;
      --cream: #FFF8F0; --muted: #A89F9A;
      --success: #4CAF7D; --danger: #E05C5C; --info: #4A90D9;
      --border: rgba(244,168,50,0.15);
      --radius: 14px;
    }
    body { background: var(--bg); color: var(--cream); font-family: 'Inter', sans-serif; min-height: 100vh; }

    /* ── LOGIN ── */
    .login-wrap {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 50% 30%, rgba(244,168,50,0.1) 0%, transparent 70%);
    }
    .login-box {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 20px; padding: 48px 40px; width: 380px; text-align: center;
    }
    .login-icon { font-size: 48px; margin-bottom: 16px; }
    .login-title { font-family: 'Playfair Display', serif; font-size: 24px; color: var(--cream); margin-bottom: 6px; }
    .login-sub { font-size: 13px; color: var(--muted); margin-bottom: 32px; }
    .login-field { margin-bottom: 16px; text-align: left; }
    .login-field label { display: block; font-size: 11px; font-weight: 600; color: var(--gold); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; }
    .login-field input {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 16px; color: var(--cream);
      font-family: 'Inter', sans-serif; font-size: 14px; outline: none;
      transition: border-color 0.2s;
    }
    .login-field input:focus { border-color: var(--gold); }
    .login-btn {
      width: 100%; padding: 14px; background: var(--gold); color: #1A1A2E;
      border: none; border-radius: var(--radius); font-family: 'Inter', sans-serif;
      font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 8px;
      transition: background 0.2s;
    }
    .login-btn:hover { background: var(--gold-dark); }
    .login-error { font-size: 13px; color: var(--danger); margin-top: 12px; display: none; }

    /* ── DASHBOARD ── */
    .dashboard { display: none; }

    header {
      background: rgba(26,26,46,0.96); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 24px; height: 64px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-icon { width: 36px; height: 36px; border-radius: 10px; background: var(--gold); display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .brand-name { font-family: 'Playfair Display', serif; font-size: 17px; font-weight: 700; }
    .brand-badge { font-size: 10px; background: rgba(244,168,50,0.15); color: var(--gold); border: 1px solid rgba(244,168,50,0.3); border-radius: 20px; padding: 2px 10px; margin-left: 8px; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
    .live-label { font-size: 12px; color: var(--success); font-weight: 500; }
    .logout-btn {
      padding: 8px 16px; border-radius: 50px; border: 1px solid var(--border);
      background: transparent; color: var(--muted); font-family: 'Inter', sans-serif;
      font-size: 13px; cursor: pointer; transition: all 0.2s;
    }
    .logout-btn:hover { border-color: var(--danger); color: var(--danger); }

    .stats-bar {
      display: flex; gap: 16px; padding: 20px 24px;
      overflow-x: auto; scrollbar-width: none;
    }
    .stats-bar::-webkit-scrollbar { display: none; }
    .stat-card {
      flex-shrink: 0; background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px 24px; min-width: 150px;
    }
    .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 6px; }
    .stat-val { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 700; color: var(--gold); }
    .stat-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .filters {
      padding: 0 24px 16px;
      display: flex; gap: 8px; flex-wrap: wrap;
    }
    .filter-btn {
      padding: 8px 18px; border-radius: 50px; border: 1.5px solid var(--border);
      background: transparent; color: var(--muted); font-family: 'Inter', sans-serif;
      font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s;
    }
    .filter-btn:hover { color: var(--cream); border-color: var(--gold); }
    .filter-btn.active { background: rgba(244,168,50,0.15); color: var(--gold); border-color: var(--gold); font-weight: 600; }

    .orders-grid {
      padding: 0 24px 40px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }

    .order-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden;
      transition: box-shadow 0.2s;
      animation: slideIn 0.3s ease;
    }
    @keyframes slideIn { from { opacity:0; transform: translateY(12px); } to { opacity:1; transform: translateY(0); } }
    .order-card:hover { box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
    .order-card.status-received { border-color: rgba(74,144,217,0.4); }
    .order-card.status-preparing { border-color: rgba(244,168,50,0.5); }
    .order-card.status-ready { border-color: rgba(76,175,125,0.5); }
    .order-card.status-done { opacity: 0.55; }

    .order-header {
      padding: 14px 16px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .order-num { font-family: 'Playfair Display', serif; font-size: 18px; font-weight: 700; color: var(--gold); }
    .order-type-tag {
      font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px;
    }
    .order-type-tag.dinein { background: rgba(74,144,217,0.15); color: var(--info); border: 1px solid rgba(74,144,217,0.3); }
    .order-type-tag.takeaway { background: rgba(244,168,50,0.12); color: var(--gold); border: 1px solid rgba(244,168,50,0.25); }

    .order-meta { padding: 12px 16px; border-bottom: 1px solid var(--border); }
    .order-customer { font-size: 15px; font-weight: 600; color: var(--cream); display: flex; align-items: center; gap: 6px; }
    .order-time { font-size: 11px; color: var(--muted); margin-top: 3px; }
    .order-notes { font-size: 12px; color: var(--muted); margin-top: 6px; font-style: italic; }

    .order-items { padding: 12px 16px; border-bottom: 1px solid var(--border); }
    .order-item-row { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; }
    .order-item-name { color: var(--cream); }
    .order-item-qty { color: var(--muted); }
    .order-total { font-size: 13px; font-weight: 600; color: var(--gold); margin-top: 8px; text-align: right; }

    .order-status-row {
      padding: 12px 16px;
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .status-badge {
      font-size: 11px; font-weight: 600; padding: 4px 12px; border-radius: 20px;
      text-transform: uppercase; letter-spacing: 0.08em;
    }
    .status-badge.received { background: rgba(74,144,217,0.15); color: var(--info); }
    .status-badge.preparing { background: rgba(244,168,50,0.15); color: var(--gold); }
    .status-badge.ready { background: rgba(76,175,125,0.15); color: var(--success); }
    .status-badge.done { background: rgba(255,255,255,0.08); color: var(--muted); }

    .action-btns { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
    .action-btn {
      padding: 7px 14px; border-radius: 50px; border: none;
      font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600;
      cursor: pointer; transition: all 0.2s;
    }
    .action-btn.prepare { background: rgba(244,168,50,0.2); color: var(--gold); border: 1px solid rgba(244,168,50,0.4); }
    .action-btn.prepare:hover { background: var(--gold); color: #1A1A2E; }
    .action-btn.ready { background: rgba(76,175,125,0.2); color: var(--success); border: 1px solid rgba(76,175,125,0.4); }
    .action-btn.ready:hover { background: var(--success); color: #fff; }
    .action-btn.done { background: rgba(255,255,255,0.06); color: var(--muted); border: 1px solid rgba(255,255,255,0.1); }
    .action-btn.done:hover { background: rgba(255,255,255,0.12); }
    .action-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .empty-state {
      grid-column: 1/-1; text-align: center;
      padding: 80px 24px; color: var(--muted);
    }
    .empty-icon { font-size: 56px; margin-bottom: 16px; opacity: 0.4; }
    .empty-text { font-size: 16px; }

    /* New order notification */
    .notif {
      position: fixed; top: 80px; right: 24px;
      background: var(--gold); color: #1A1A2E;
      padding: 12px 20px; border-radius: 12px;
      font-weight: 600; font-size: 14px;
      box-shadow: 0 8px 24px rgba(244,168,50,0.4);
      animation: notifIn 0.3s ease;
      z-index: 999;
    }
    @keyframes notifIn { from { opacity:0; transform: translateX(40px); } to { opacity:1; transform: translateX(0); } }

    @media (max-width: 600px) {
      .orders-grid { padding: 0 12px 40px; grid-template-columns: 1fr; }
      .stats-bar { padding: 16px 12px; }
      .filters { padding: 0 12px 12px; }
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <div class="login-icon">🍽️</div>
    <div class="login-title">Kitchen Admin</div>
    <div class="login-sub">D&D by Tongue Tempt — Staff only</div>
    <div class="login-field">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="admin@tonguetempt.com"/>
    </div>
    <div class="login-field">
      <label>Password</label>
      <input type="password" id="loginPass" placeholder="••••••••" onkeydown="if(event.key==='Enter') doLogin()"/>
    </div>
    <button class="login-btn" onclick="doLogin()">Sign In →</button>
    <div class="login-error" id="loginError">Invalid email or password</div>
  </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">
  <header>
    <div class="brand">
      <div class="brand-icon">🍽️</div>
      <div>
        <span class="brand-name">D&D by Tongue Tempt</span>
        <span class="brand-badge">Kitchen Dashboard</span>
      </div>
    </div>
    <div class="header-right">
      <div class="live-dot"></div>
      <span class="live-label">Live</span>
      <button class="logout-btn" onclick="doLogout()">Sign Out</button>
    </div>
  </header>

  <div class="stats-bar" id="statsBar">
    <div class="stat-card">
      <div class="stat-label">New Orders</div>
      <div class="stat-val" id="statNew">—</div>
      <div class="stat-sub">Waiting</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Preparing</div>
      <div class="stat-val" id="statPreparing">—</div>
      <div class="stat-sub">In kitchen</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Ready</div>
      <div class="stat-val" id="statReady">—</div>
      <div class="stat-sub">For pickup</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Done Today</div>
      <div class="stat-val" id="statDone">—</div>
      <div class="stat-sub">Completed</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Revenue Today</div>
      <div class="stat-val" id="statRevenue">—</div>
      <div class="stat-sub">AUD</div>
    </div>
  </div>

  <div class="filters">
    <button class="filter-btn active" data-filter="active" onclick="setFilter('active', this)">🔥 Active Orders</button>
    <button class="filter-btn" data-filter="received" onclick="setFilter('received', this)">🔵 New</button>
    <button class="filter-btn" data-filter="preparing" onclick="setFilter('preparing', this)">👨‍🍳 Preparing</button>
    <button class="filter-btn" data-filter="ready" onclick="setFilter('ready', this)">✅ Ready</button>
    <button class="filter-btn" data-filter="done" onclick="setFilter('done', this)">📦 Done</button>
    <button class="filter-btn" data-filter="all" onclick="setFilter('all', this)">📋 All</button>
  </div>

  <div class="orders-grid" id="ordersGrid">
    <div class="empty-state">
      <div class="empty-icon">⏳</div>
      <div class="empty-text">Loading orders...</div>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://nvwvowbujxpasgxalnje.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im52d3Zvd2J1anhwYXNneGFsbmplIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTYwOTEsImV4cCI6MjEwMDkzMjA5MX0.aIuPTx0EISxpOCZAKP5CaLqzjq27rEnFkfG1AXxq-ak';

  // ── ADMIN CREDENTIALS (change these!) ──
  const ADMIN_EMAIL = 'admin@tonguetempt.com';
  const ADMIN_PASS  = 'DnD@2024!';

  let allOrders = [];
  let currentFilter = 'active';
  let pollInterval = null;
  let lastOrderCount = 0;
  let isLoggedIn = false;

  // ── SUPABASE HELPER ──
  async function sbQuery(table, method, body, extra) {
    method = method || 'GET'; extra = extra || '';
    const headers = {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json',
    };
    if (method === 'POST') headers['Prefer'] = 'return=representation';
    if (method === 'PATCH') headers['Prefer'] = 'return=minimal';

    const res = await fetch(SUPABASE_URL + '/rest/v1/' + table + extra, {
      method: method,
      headers: headers,
      body: body ? JSON.stringify(body) : null
    });
    if (!res.ok) {
      const errText = await res.text();
      console.error('Supabase error:', res.status, errText);
      throw new Error(errText);
    }
    if (method === 'DELETE' || method === 'PATCH') return null;
    const text = await res.text();
    return text ? JSON.parse(text) : null;
  }

  // ── LOGIN ──
  function doLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    const pass  = document.getElementById('loginPass').value;
    const errEl = document.getElementById('loginError');

    if (email === ADMIN_EMAIL && pass === ADMIN_PASS) {
      isLoggedIn = true;
      document.getElementById('loginWrap').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      startDashboard();
    } else {
      errEl.style.display = 'block';
      setTimeout(() => errEl.style.display = 'none', 3000);
    }
  }

  function doLogout() {
    isLoggedIn = false;
    if (pollInterval) clearInterval(pollInterval);
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('loginWrap').style.display = 'flex';
    document.getElementById('loginPass').value = '';
  }

  // ── DASHBOARD ──
  function startDashboard() {
    loadOrders();
    pollInterval = setInterval(loadOrders, 6000); // refresh every 6s
  }

  async function loadOrders() {
    try {
      // Get today's orders with items
      const today = new Date().toISOString().split('T')[0];
      const orders = await sbQuery('orders', 'GET', null,
        '?created_at=gte.' + today + 'T00:00:00&order=created_at.desc');

      // Get items for these orders
      if (orders.length > 0) {
        const ids = orders.map(o => o.id).join(',');
        const items = await sbQuery('order_items', 'GET', null,
          '?order_id=in.(' + ids + ')');

        // Attach items to orders
        orders.forEach(o => {
          o.items = items.filter(i => i.order_id === o.id);
        });
      }

      // Check for new orders and notify
      const activeCount = orders.filter(o => o.status === 'received').length;
      if (isLoggedIn && lastOrderCount > 0 && activeCount > lastOrderCount) {
        showNotif('🔔 New order received!');
        playBeep();
      }
      lastOrderCount = activeCount;

      allOrders = orders;
      renderOrders();
      updateStats();

    } catch(e) {
      console.error('Load error:', e);
    }
  }

  function updateStats() {
    const received  = allOrders.filter(o => o.status === 'received').length;
    const preparing = allOrders.filter(o => o.status === 'preparing').length;
    const ready     = allOrders.filter(o => o.status === 'ready').length;
    const done      = allOrders.filter(o => o.status === 'done').length;
    const revenue   = allOrders.filter(o => o.status === 'done').reduce((s, o) => s + (o.total || 0), 0);

    document.getElementById('statNew').textContent      = received;
    document.getElementById('statPreparing').textContent = preparing;
    document.getElementById('statReady').textContent    = ready;
    document.getElementById('statDone').textContent     = done;
    document.getElementById('statRevenue').textContent  = '$' + revenue.toFixed(0);
  }

  let currentFilter2 = 'active';
  function setFilter(f, el) {
    currentFilter2 = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    renderOrders();
  }

  function renderOrders() {
    let filtered = allOrders;
    if (currentFilter2 === 'active') {
      filtered = allOrders.filter(o => ['received','preparing','ready'].includes(o.status));
    } else if (currentFilter2 !== 'all') {
      filtered = allOrders.filter(o => o.status === currentFilter2);
    }

    const grid = document.getElementById('ordersGrid');
    if (filtered.length === 0) {
      grid.innerHTML = '<div class="empty-state"><div class="empty-icon">✅</div><div class="empty-text">No orders here right now</div></div>';
      return;
    }

    grid.innerHTML = filtered.map(order => buildOrderCard(order)).join('');
  }

  function buildOrderCard(order) {
    const statusLabel = { received: '🔵 New Order', preparing: '👨‍🍳 Preparing', ready: '✅ Ready', done: '📦 Done' };
    const typeLabel   = order.order_type === 'dinein' ? 'Dine-In' : 'Takeaway';
    const typeClass   = order.order_type === 'dinein' ? 'dinein' : 'takeaway';
    const time        = new Date(order.created_at).toLocaleTimeString('en-AU', { hour:'2-digit', minute:'2-digit' });

    const itemsHtml = (order.items || []).map(item =>
      `<div class="order-item-row">
        <span class="order-item-name">${item.item_name}</span>
        <span class="order-item-qty">x${item.quantity}</span>
       </div>`
    ).join('');

    const notesHtml = order.notes
      ? `<div class="order-notes">📝 ${order.notes}</div>` : '';

    // Action buttons based on status
    let actionsHtml = '';
    if (order.status === 'received') {
      actionsHtml = `<button class="action-btn prepare" onclick="updateStatus('${order.id}','preparing')">Start Preparing</button>`;
    } else if (order.status === 'preparing') {
      actionsHtml = `<button class="action-btn ready" onclick="updateStatus('${order.id}','ready')">Mark Ready ✓</button>`;
    } else if (order.status === 'ready') {
      actionsHtml = `<button class="action-btn done" onclick="updateStatus('${order.id}','done')">Mark Done</button>`;
    }

    return `
      <div class="order-card status-${order.status}" id="order-${order.id}">
        <div class="order-header">
          <span class="order-num">#${order.order_number}</span>
          <span class="order-type-tag ${typeClass}">${typeLabel}</span>
        </div>
        <div class="order-meta">
          <div class="order-customer">👤 ${order.customer_name}</div>
          <div class="order-time">⏱ ${time}</div>
          ${notesHtml}
        </div>
        <div class="order-items">
          ${itemsHtml}
          <div class="order-total">Total: $${(order.total || 0).toFixed(0)}</div>
        </div>
        <div class="order-status-row">
          <span class="status-badge ${order.status}">${statusLabel[order.status] || order.status}</span>
          <div class="action-btns">${actionsHtml}</div>
        </div>
      </div>`;
  }

  async function updateStatus(orderId, newStatus) {
    try {
      // Update in Supabase FIRST
      await sbQuery('orders', 'PATCH', { status: newStatus }, '?id=eq.' + orderId);

      // Then update UI optimistically
      const order = allOrders.find(o => o.id === orderId);
      if (order) order.status = newStatus;
      renderOrders();
      updateStats();

    } catch(e) {
      console.error('Update failed:', e);
      alert('Failed to update order status: ' + e.message);
      loadOrders();
    }
  }

  // ── NOTIFICATION ──
  function showNotif(msg) {
    const el = document.createElement('div');
    el.className = 'notif';
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3500);
  }

  function playBeep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine'; osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
      osc.start(); osc.stop(ctx.currentTime + 0.6);
    } catch(e) {}
  }
</script>
</body>
</html>
